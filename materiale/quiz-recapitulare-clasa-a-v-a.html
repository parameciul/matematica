<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz pe echipe: recapitularea clasei a V-a – Matematică cu Laura Miron</title>
<meta name="description" content="Quiz pe echipe pentru videoproiector: recapitularea materiei clasei a V-a.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
  /* O singura tema, deliberat luminoasa: se proiecteaza intr-o sala luminata, pe "hartie de caiet". */
  :root {
    color-scheme: light;
    --paper: #F6F9FC;
    --grid: #E0E9F2;
    --panel: #FFFFFF;
    --ink: #172646;
    --ink-soft: #52607A;
    --rule: #C8D5E2;
    --margin: #D33A48;
    --marker: #FFE66B;
    --good: #1D8F5F;
    --good-soft: #E6F4EC;
    --pen-a: #2F6BD6;
    --pen-b: #1D8F5F;
    --pen-c: #C9661A;
    --pen-d: #7F4CC9;
    --f-display: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    --cell: 26px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding-inline: 16px;
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: var(--cell) var(--cell);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 18px;
    line-height: 1.4;
  }
  .app {
    max-width: 1480px;
    margin: 0 auto;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 18px;
    padding-block: 18px;
  }

  /* bara de sus */
  .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; }
  .brand .cls {
    font-family: var(--f-body); font-weight: 700; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase;
    color: var(--panel); background: var(--ink); padding: 3px 9px; border-radius: 4px;
  }
  .rounds { display: flex; flex-wrap: wrap; gap: 8px; }
  .rounds button {
    font: 700 1rem var(--f-body); color: var(--ink); background: var(--panel);
    border: 2px solid var(--ink); border-radius: 999px; padding: 6px 16px; cursor: pointer;
  }
  .rounds button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
  .dots { display: flex; gap: 7px; align-items: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-soft); background: var(--panel); padding: 0; cursor: pointer; }
  .dot.done { background: var(--marker); }
  .dot.now { background: var(--ink); border-color: var(--ink); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 22px; align-items: start; }

  /* foaia de caiet cu marginea rosie */
  .sheet {
    position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    padding: 26px 32px 24px 100px; box-shadow: 0 14px 32px -22px rgba(23, 38, 70, .45);
  }
  .sheet::before { content: ""; position: absolute; top: 0; bottom: 0; left: 76px; width: 2px; background: var(--margin); opacity: .8; }
  .qnum {
    position: absolute; left: 0; top: 24px; width: 76px; text-align: center;
    font-family: var(--f-display); font-weight: 800; font-size: 2.7rem; line-height: 1; color: var(--margin);
  }
  .eyebrow { margin: 0 0 8px; font-size: .85rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }
  .qtext {
    margin: 0 0 26px; font-family: var(--f-display); font-weight: 700;
    font-size: clamp(1.9rem, 3.5vw, 3.2rem); line-height: 1.15; text-wrap: balance;
  }
  .answers { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .ans {
    display: flex; align-items: center; gap: 16px; min-height: 90px; padding: 12px 18px;
    background: var(--panel); border: 2px solid var(--rule); border-radius: 8px;
    font-size: clamp(1.4rem, 2.4vw, 2.2rem); font-weight: 700; font-variant-numeric: tabular-nums;
    transition: opacity .25s ease, background-color .25s ease, border-color .25s ease;
  }
  .chip {
    flex: none; display: grid; place-items: center; width: 54px; height: 54px; border-radius: 50%;
    color: #FFFFFF; font-family: var(--f-display); font-weight: 800; font-size: 1.7rem; line-height: 1;
  }
  .ans:nth-child(1) .chip { background: var(--pen-a); }
  .ans:nth-child(2) .chip { background: var(--pen-b); }
  .ans:nth-child(3) .chip { background: var(--pen-c); }
  .ans:nth-child(4) .chip { background: var(--pen-d); }
  .ans .tag { margin-left: auto; font-size: .95rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink); }
  .revealed .ans { opacity: .35; }
  .revealed .ans.correct { opacity: 1; background: var(--marker); border-color: var(--ink); }

  .why {
    margin: 18px 0 0; padding: 10px 16px; border-left: 5px solid var(--good); background: var(--good-soft);
    font-size: clamp(1.1rem, 1.7vw, 1.45rem); border-radius: 0 6px 6px 0;
  }

  .frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .78em; line-height: 1.05; margin: 0 .12em; }
  .frac > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .18em .04em; }
  .frac > span:last-child { padding: .04em .18em 0; }
  sup { font-size: .6em; line-height: 0; }

  /* cronometru */
  .timer { margin-top: 22px; display: flex; align-items: center; gap: 14px; }
  .track { flex: 1; height: 14px; border-radius: 999px; background: var(--grid); border: 1px solid var(--rule); overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--ink); transform-origin: left center; transition: transform 1s linear; }
  .timer.low .fill { background: var(--margin); }
  .timer.out .tnum { color: var(--margin); }
  .tnum { min-width: 3.2ch; text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }

  .controls { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    font: 700 1.05rem var(--f-body); color: var(--ink); background: var(--panel);
    border: 2px solid var(--ink); border-radius: 8px; padding: 10px 18px; cursor: pointer;
  }
  .btn.primary { background: var(--ink); color: var(--panel); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn:hover:not(:disabled) { box-shadow: 0 3px 0 var(--ink); transform: translateY(-1px); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--pen-a); outline-offset: 2px; }

  /* clasament */
  .rank { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .rank li {
    display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px;
    padding: 12px 18px; border: 2px solid var(--rule); border-radius: 8px; font-size: clamp(1.3rem, 2.2vw, 2rem); font-weight: 700;
  }
  .rank li:first-child { background: var(--marker); border-color: var(--ink); }
  .rank .place { font-family: var(--f-display); font-weight: 800; color: var(--margin); font-size: 1.1em; }
  .rank .pts { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; }

  /* panoul de punctaj */
  .board { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 16px 18px 14px; }
  .board h2 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 800; font-size: 1.55rem; }
  .board .hint { margin: 0 0 8px; font-size: .85rem; color: var(--ink-soft); }
  .teams { list-style: none; margin: 0; padding: 0; }
  .team { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 4px 12px; padding: 10px 0; border-top: 1px dashed var(--rule); }
  .team label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
  .team input {
    grid-column: 1; font: 700 1.1rem var(--f-body); color: var(--ink); background: transparent;
    border: 0; border-bottom: 1px solid var(--rule); padding: 2px 0; width: 100%; min-width: 0;
  }
  .score { grid-column: 2; grid-row: 1 / span 2; align-self: center; font-family: var(--f-display); font-weight: 800; font-size: 2.6rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; min-width: 2ch; }
  .pm { grid-column: 1 / -1; display: flex; gap: 8px; }
  .pm button { font: 700 1rem var(--f-body); min-width: 52px; padding: 5px 10px; border-radius: 6px; border: 2px solid var(--ink); background: var(--panel); color: var(--ink); cursor: pointer; }
  .pm button.plus { background: var(--ink); color: var(--panel); }
  .board-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); }
  .board-actions .btn { font-size: .9rem; padding: 6px 12px; }

  .keys { font-size: .9rem; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 6px 18px; }
  kbd { font: 700 .8rem var(--f-body); color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; }

  @media (max-width: 1000px) { .main { grid-template-columns: 1fr; } }
  @media (max-width: 620px) {
    .answers { grid-template-columns: 1fr; }
    .sheet { padding: 20px 16px 18px 58px; }
    .sheet::before { left: 44px; }
    .qnum { width: 44px; font-size: 1.8rem; top: 20px; }
    .ans { min-height: 64px; }
    .chip { width: 42px; height: 42px; font-size: 1.3rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ans, .fill, .btn { transition: none; }
    .btn:hover:not(:disabled) { transform: none; }
  }
  .back { font: 700 1rem var(--f-body); color: var(--ink); }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="back" href="../clasa.html?c=6">← Înapoi la site</a>
    <div class="brand"><span class="cls">Clasa a VI-a</span>Recapitulare pe echipe</div>
    <div class="rounds" role="tablist" aria-label="Runde" id="rounds"></div>
    <div class="dots" id="dots" aria-label="Întrebările rundei"></div>
  </header>

  <div class="main">
    <main class="sheet" id="sheet" aria-live="polite"></main>

    <aside class="board" aria-labelledby="board-title">
      <h2 id="board-title">Punctaj</h2>
      <p class="hint">Tastele 1–6 dau un punct echipei; Shift + tasta scade un punct.</p>
      <ol class="teams" id="teams"></ol>
      <div class="board-actions">
        <button class="btn" type="button" id="team-add">Adaugă echipă</button>
        <button class="btn" type="button" id="team-remove">Elimină echipă</button>
        <button class="btn" type="button" id="score-reset">Punctaj nou</button>
      </div>
    </aside>
  </div>

  <footer class="keys">
    <span><kbd>Spațiu</kbd> pornește / oprește cronometrul</span>
    <span><kbd>Enter</kbd> arată răspunsul</span>
    <span><kbd>←</kbd> <kbd>→</kbd> întrebarea anterioară / următoare</span>
    <span><kbd>F11</kbd> ecran complet</span>
  </footer>
</div>

<script>
(() => {
  const TIME = 45;
  const KEY = 'quiz-recapitulare-clasa-a-v-a';
  const fr = (n, d) => `<span class="frac" role="img" aria-label="${n} supra ${d}"><span>${n}</span><span>${d}</span></span>`;

  const ROUNDS = [
    { name: 'Runda 1', topic: 'Algebră', qs: [
      { q: 'Cât este 125 : 5 − 4 · 5?', a: ['5', '105', '1', '45'], c: 0,
        why: 'Întâi împărțirea și înmulțirea: 125 : 5 = 25 și 4 · 5 = 20. Apoi 25 − 20 = 5.' },
      { q: 'Care este cel mai mic număr prim de două cifre?', a: ['10', '11', '13', '21'], c: 1,
        why: '10 = 2 · 5 nu este prim. 11 are doar divizorii 1 și 11.' },
      { q: 'Cât este 4<sup>3</sup>?', a: ['12', '64', '43', '7'], c: 1,
        why: '4<sup>3</sup> = 4 · 4 · 4 = 64, nu 4 · 3.' },
      { q: 'Media aritmetică a numerelor 8, 10 și 15 este:', a: ['11', '33', '10', '12'], c: 0,
        why: '(8 + 10 + 15) : 3 = 33 : 3 = 11.' },
      { q: `Cât reprezintă ${fr(2, 5)} din 45?`, a: ['18', '9', '27', '90'], c: 0,
        why: '45 : 5 = 9, apoi 9 · 2 = 18.' },
      { q: 'Cât este 0,6 + 0,45?', a: ['1,05', '0,51', '1,5', '0,105'], c: 0,
        why: 'Scriem cu același număr de zecimale: 0,60 + 0,45 = 1,05.' },
      { q: `Care fracție este echivalentă cu ${fr(3, 4)}?`, a: [fr(6, 9), fr(9, 12), fr(3, 8), fr(4, 3)], c: 1,
        why: `Amplificăm cu 3: ${fr(3, 4)} = ${fr(9, 12)}.` },
      { q: 'Câte numere naturale de două cifre sunt divizibile cu 10?', a: ['9', '10', '90', '8'], c: 0,
        why: '10, 20, 30, …, 90 – adică 9 numere.' },
    ]},
    { name: 'Runda 2', topic: 'Geometrie', qs: [
      { q: 'Un unghi cu măsura de 90° este un unghi:', a: ['ascuțit', 'drept', 'obtuz', 'alungit'], c: 1,
        why: 'Unghiul drept are 90°; cel ascuțit are mai puțin, cel obtuz mai mult, iar cel alungit are 180°.' },
      { q: '1 m<sup>2</sup> este egal cu:', a: ['10 dm<sup>2</sup>', '100 dm<sup>2</sup>', '1000 dm<sup>2</sup>', '10 000 dm<sup>2</sup>'], c: 1,
        why: '1 m = 10 dm, deci 1 m<sup>2</sup> = 10 dm · 10 dm = 100 dm<sup>2</sup>.' },
      { q: 'Perimetrul unui dreptunghi cu dimensiunile de 9 cm și 6 cm este:', a: ['15 cm', '30 cm', '54 cm', '36 cm'], c: 1,
        why: 'P = 2 · (9 + 6) = 30 cm. Numărul 54 este aria, în cm<sup>2</sup>.' },
      { q: 'Volumul unui cub cu muchia de 3 cm este:', a: ['9 cm<sup>3</sup>', '27 cm<sup>3</sup>', '18 cm<sup>3</sup>', '12 cm<sup>3</sup>'], c: 1,
        why: 'V = 3 · 3 · 3 = 27 cm<sup>3</sup>.' },
      { q: '1 litru este egal cu:', a: ['10 cm<sup>3</sup>', '100 cm<sup>3</sup>', '1000 cm<sup>3</sup>', '10 000 cm<sup>3</sup>'], c: 2,
        why: '1 l = 1 dm<sup>3</sup> = 10 cm · 10 cm · 10 cm = 1000 cm<sup>3</sup>.' },
      { q: 'Cât este 180° − 64°25′?', a: ['115°35′', '116°75′', '124°25′', '116°35′'], c: 0,
        why: 'Scriem 180° = 179°60′. Apoi 179°60′ − 64°25′ = 115°35′.' },
      { q: 'Prin două puncte distincte trec:', a: ['nicio dreaptă', 'o singură dreaptă', 'exact două drepte', 'o infinitate de drepte'], c: 1,
        why: 'Prin două puncte distincte trece o dreaptă și numai una.' },
      { q: 'Un pătrat are latura de 2,5 dm. Aria lui, în cm<sup>2</sup>, este:', a: ['100 cm<sup>2</sup>', '625 cm<sup>2</sup>', '62,5 cm<sup>2</sup>', '6,25 cm<sup>2</sup>'], c: 1,
        why: '2,5 dm = 25 cm, deci A = 25 · 25 = 625 cm<sup>2</sup>.' },
    ]},
  ];

  const defaults = () => ({ round: 0, idx: 0, revealed: false, end: false,
    teams: [1, 2, 3, 4].map(i => ({ name: `Echipa ${i}`, score: 0 })) });
  const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); return s && Array.isArray(s.teams) ? s : null; } catch (e) { return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  let state = defaults();
  let timeLeft = TIME;
  let ticking = null;
  let resetArmed = null;

  const $ = id => document.getElementById(id);

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 660; g.gain.value = 0.12;
      o.connect(g); g.connect(ctx.destination); o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
      o.stop(ctx.currentTime + 0.62);
    } catch (e) {}
  }

  function stopTimer() { if (ticking) { clearInterval(ticking); ticking = null; } }
  function resetTimer() { stopTimer(); timeLeft = TIME; }
  function toggleTimer() {
    if (state.end) return;
    if (ticking) { stopTimer(); renderTimer(); return; }
    if (timeLeft <= 0) timeLeft = TIME;
    ticking = setInterval(() => {
      timeLeft -= 1;
      if (timeLeft <= 0) { timeLeft = 0; stopTimer(); beep(); }
      renderTimer();
    }, 1000);
    renderTimer();
  }

  function setRound(r) { state.round = r; state.idx = 0; state.revealed = false; state.end = false; resetTimer(); save(); render(); }
  function goTo(i) { state.idx = i; state.revealed = false; state.end = false; resetTimer(); save(); render(); }
  function next() {
    const n = ROUNDS[state.round].qs.length;
    if (state.end) { if (state.round < ROUNDS.length - 1) setRound(state.round + 1); return; }
    if (state.idx < n - 1) goTo(state.idx + 1);
    else { state.end = true; resetTimer(); save(); render(); }
  }
  function prev() {
    if (state.end) { state.end = false; save(); render(); return; }
    if (state.idx > 0) goTo(state.idx - 1);
  }
  function reveal() { if (state.end) return; state.revealed = true; stopTimer(); save(); render(); }
  function addPoint(t, d) {
    if (!state.teams[t]) return;
    state.teams[t].score += d;
    save(); renderTeams(); if (state.end) renderSheet();
  }

  function renderTimer() {
    const box = document.querySelector('.timer');
    if (!box) return;
    box.querySelector('.fill').style.transform = `scaleX(${timeLeft / TIME})`;
    box.querySelector('.tnum').textContent = timeLeft;
    box.classList.toggle('low', timeLeft <= 10 && timeLeft > 0);
    box.classList.toggle('out', timeLeft === 0);
    const tb = $('btn-timer');
    if (tb) tb.textContent = ticking ? 'Oprește timpul' : (timeLeft === TIME ? 'Pornește timpul' : (timeLeft === 0 ? 'Timpul a expirat – repornește' : 'Continuă timpul'));
  }

  function renderHeader() {
    $('rounds').innerHTML = ROUNDS.map((r, i) =>
      `<button type="button" role="tab" id="tab-${i}" aria-selected="${i === state.round}" data-round="${i}">${r.name} · ${r.topic}</button>`).join('');
    const n = ROUNDS[state.round].qs.length;
    $('dots').innerHTML = Array.from({ length: n }, (_, i) => {
      const cls = !state.end && i === state.idx ? 'now' : (state.end || i < state.idx ? 'done' : '');
      return `<button type="button" class="dot ${cls}" data-q="${i}" aria-label="Întrebarea ${i + 1}"></button>`;
    }).join('');
  }

  function renderSheet() {
    const r = ROUNDS[state.round];
    const sheet = $('sheet');
    if (state.end) {
      const order = state.teams.map((t, i) => ({ ...t, i })).sort((a, b) => b.score - a.score);
      const last = state.round === ROUNDS.length - 1;
      sheet.className = 'sheet';
      sheet.innerHTML = `
        <div class="qnum" aria-hidden="true">✓</div>
        <p class="eyebrow">${r.name} · ${r.topic} · încheiată</p>
        <h1 class="qtext">Clasamentul după ${r.name.toLowerCase()}</h1>
        <ol class="rank">${order.map((t, k) => `<li><span class="place">${k + 1}.</span><span>${escapeHtml(t.name)}</span><span class="pts">${showScore(t.score)} p</span></li>`).join('')}</ol>
        <div class="controls">
          <button class="btn" type="button" id="btn-prev">Înapoi la ultima întrebare</button>
          ${last ? '' : `<button class="btn primary" type="button" id="btn-next">Începe ${ROUNDS[state.round + 1].name.toLowerCase()} · ${ROUNDS[state.round + 1].topic}</button>`}
        </div>`;
      return;
    }
    const q = r.qs[state.idx];
    sheet.className = 'sheet' + (state.revealed ? ' revealed' : '');
    sheet.innerHTML = `
      <div class="qnum" aria-hidden="true">${state.idx + 1}.</div>
      <p class="eyebrow">${r.name} · ${r.topic} · întrebarea ${state.idx + 1} din ${r.qs.length}</p>
      <h1 class="qtext">${q.q}</h1>
      <ol class="answers">${q.a.map((a, i) => `
        <li class="ans${i === q.c ? ' correct' : ''}"><span class="chip" aria-hidden="true">${'ABCD'[i]}</span><span>${a}</span>${state.revealed && i === q.c ? '<span class="tag">corect</span>' : ''}</li>`).join('')}
      </ol>
      ${state.revealed ? `<p class="why"><strong>De ce?</strong> ${q.why}</p>` : ''}
      <div class="timer" aria-label="Cronometru"><div class="track"><div class="fill"></div></div><span class="tnum">${timeLeft}</span></div>
      <div class="controls">
        <button class="btn" type="button" id="btn-prev" ${state.idx === 0 ? 'disabled' : ''}>Înapoi</button>
        <button class="btn" type="button" id="btn-timer">Pornește timpul</button>
        <button class="btn primary" type="button" id="btn-reveal" ${state.revealed ? 'disabled' : ''}>Arată răspunsul</button>
        <button class="btn" type="button" id="btn-next">${state.idx === r.qs.length - 1 ? 'Vezi clasamentul' : 'Următoarea'}</button>
      </div>`;
    renderTimer();
  }

  // punctajele negative se afiseaza cu semnul minus tipografic (−3), nu cu cratima
  const showScore = n => n < 0 ? `−${-n}` : String(n);

  function escapeHtml(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  function renderTeams() {
    $('teams').innerHTML = state.teams.map((t, i) => `
      <li class="team">
        <label for="team-name-${i}">Echipa ${i + 1} · tasta ${i + 1}</label>
        <input id="team-name-${i}" data-team="${i}" value="${escapeHtml(t.name)}" autocomplete="off">
        <span class="score" aria-live="polite">${showScore(t.score)}</span>
        <div class="pm">
          <button type="button" class="plus" data-add="${i}" aria-label="Un punct pentru ${escapeHtml(t.name)}">+1</button>
          <button type="button" data-sub="${i}" aria-label="Scade un punct pentru ${escapeHtml(t.name)}">−1</button>
        </div>
      </li>`).join('');
    $('team-add').disabled = state.teams.length >= 6;
    $('team-remove').disabled = state.teams.length <= 2;
  }

  function render() { renderHeader(); renderSheet(); renderTeams(); }

  document.addEventListener('click', e => {
    const el = e.target.closest('button');
    if (!el) return;
    if (el.dataset.round !== undefined) return setRound(+el.dataset.round);
    if (el.dataset.q !== undefined) return goTo(+el.dataset.q);
    if (el.dataset.add !== undefined) return addPoint(+el.dataset.add, 1);
    if (el.dataset.sub !== undefined) return addPoint(+el.dataset.sub, -1);
    switch (el.id) {
      case 'btn-prev': return prev();
      case 'btn-next': return next();
      case 'btn-reveal': return reveal();
      case 'btn-timer': return toggleTimer();
      case 'team-add':
        if (state.teams.length < 6) { state.teams.push({ name: `Echipa ${state.teams.length + 1}`, score: 0 }); save(); renderTeams(); }
        return;
      case 'team-remove':
        if (state.teams.length > 2) { state.teams.pop(); save(); renderTeams(); }
        return;
      case 'score-reset':
        if (resetArmed) {
          clearTimeout(resetArmed); resetArmed = null;
          state.teams.forEach(t => { t.score = 0; }); el.textContent = 'Punctaj nou';
          save(); renderTeams(); if (state.end) renderSheet();
        } else {
          el.textContent = 'Confirmă: toate la 0';
          resetArmed = setTimeout(() => { resetArmed = null; el.textContent = 'Punctaj nou'; }, 3000);
        }
        return;
    }
  });

  document.addEventListener('input', e => {
    const i = e.target.dataset && e.target.dataset.team;
    if (i === undefined) return;
    state.teams[+i].name = e.target.value || `Echipa ${+i + 1}`;
    save();
  });

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) { if (e.key === 'Enter') e.target.blur(); return; }
    if (e.target.matches('button') && (e.key === ' ' || e.key === 'Enter')) {
      if (!['btn-timer', 'btn-reveal', 'btn-next', 'btn-prev'].includes(e.target.id)) return;
    }
    if (e.key === ' ') { e.preventDefault(); toggleTimer(); }
    else if (e.key === 'Enter') { e.preventDefault(); reveal(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
    else if (/^Digit[1-6]$/.test(e.code)) { e.preventDefault(); addPoint(+e.code.slice(5) - 1, e.shiftKey ? -1 : 1); }
  });

  function start(data) {
    const s = (data && data.state) || load();
    if (s) state = Object.assign(defaults(), s);
    render();
  }
  start();
})();
</script>
</body>
</html>
