<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materiale | Laura Miron</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('matematica.theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&family=Caveat:wght@600&display=swap">
  <link rel="stylesheet" href="../assets/css/style.css?v=ac2f44be39">
  <link rel="stylesheet" href="admin.css">
  <script defer src="../assets/js/i18n.js?v=e38b73f3f8"></script>
  <script defer src="../assets/js/catalog.js?v=59ef713730"></script>
  <script defer src="../assets/js/shell.js?v=df43b32a7d"></script>
  <script defer src="../assets/js/site.js?v=0014821285"></script>
  <script defer src="../assets/js/searchbox.js?v=076583a425"></script>
  <script defer src="../assets/js/visibility.js?v=a35ae0372b"></script>
  <script defer src="admin.js"></script>
</head>
<body data-root="../">
  <header id="site-header" class="site-header"></header>

  <main id="content" class="wrap">
    <div class="page" id="admin-page">
      <h1 class="search-heading">Materiale</h1>
      <form class="search-form" id="admin-search-form" role="search">
        <label class="sr-only" for="admin-search">Caută în materiale</label>
        <input id="admin-search" type="search" autocomplete="off" spellcheck="false" placeholder="Caută după titlu, temă sau cod…">
      </form>
      <div class="filters" role="group" aria-label="Arată materialele" id="admin-filter">
        <button class="chip" type="button" data-filter="" aria-pressed="true">Toate</button>
        <button class="chip" type="button" data-filter="visible" aria-pressed="false">Vizibile</button>
        <button class="chip" type="button" data-filter="hidden" aria-pressed="false">Ascunse</button>
        <button class="chip" type="button" data-filter="scheduled" aria-pressed="false">Programate</button>
        <button class="chip" type="button" data-filter="results" aria-pressed="false">Cu rezultate</button>
      </div>
      <div class="filters filters-grade" role="group" aria-label="Arată o singură clasă" id="admin-grade-filter">
        <span class="filters-label" aria-hidden="true">Clase:</span>
        <button class="chip" type="button" data-grade="" aria-pressed="true">Toate</button>
        <button class="chip" type="button" data-grade="5" aria-pressed="false">5</button>
        <button class="chip" type="button" data-grade="6" aria-pressed="false">6</button>
        <button class="chip" type="button" data-grade="7" aria-pressed="false">7</button>
        <button class="chip" type="button" data-grade="8" aria-pressed="false">8</button>
        <button class="chip" type="button" data-grade="9" aria-pressed="false">9</button>
        <button class="chip" type="button" data-grade="10" aria-pressed="false">10</button>
        <button class="chip" type="button" data-grade="11" aria-pressed="false">11</button>
        <button class="chip" type="button" data-grade="12" aria-pressed="false">12</button>
      </div>
      <p class="search-count" id="admin-count" aria-live="polite"></p>
      <div id="admin-list" aria-busy="true"><p class="message">Se încarcă lista…</p></div>
    </div>
  </main>

  <div class="admin-bar">
    <div class="wrap admin-bar-inner">
      <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>
      <button class="chip" type="button" id="admin-reset" hidden>Renunță</button>
      <button class="button" type="button" id="admin-save" disabled>Salvează</button>
    </div>
  </div>

  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
