<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Clasa – Matematică cu Laura Miron</title>
  <link rel="canonical" href="https://lauramiron.pages.dev/clasa">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var c = Number(params.get('c'));
      var target = 'index.html';
      if (Number.isInteger(c) && c >= 5 && c <= 12) {
        target = 'clasa-' + c + '.html';
        var rest = new URLSearchParams(params);
        rest.delete('c');
        var query = rest.toString();
        if (query) target += '?' + query;
      }
      window.location.replace(target + window.location.hash);
    })();
  </script>
  <noscript>
    <h1>Alege clasa / Choose a grade</h1>

      <li><a href="clasa-12.html">Clasa a XII-a / Grade 12</a></li>
    </ul>
  </noscript>
</body>
</html>
